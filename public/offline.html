<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Offline | EMS Infra ERP</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #2563eb;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Figtree, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background:
                radial-gradient(900px 380px at 20% -5%, rgba(37, 99, 235, 0.35), transparent 60%),
                radial-gradient(900px 360px at 85% 0%, rgba(20, 184, 166, 0.28), transparent 58%),
                var(--bg);
            color: var(--text);
        }
        .shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .card {
            width: min(520px, 100%);
            background: var(--panel);
            border-radius: 16px;
            box-shadow: 0 14px 34px rgba(2, 6, 23, 0.32);
            padding: 24px;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 1.35rem;
            line-height: 1.2;
        }
        p {
            margin: 0;
            color: var(--muted);
        }
        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            appearance: none;
            border: 1px solid #cbd5e1;
            background: #fff;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            text-decoration: none;
            color: #0f172a;
            font-weight: 600;
        }
        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
    </style>
</head>
<body>
<main class="shell">
    <section class="card" role="status" aria-live="polite">
        <h1>You are offline</h1>
        <p>Connection is currently unavailable. Reconnect to sync live ERP data and continue operations.</p>
        <div class="actions">
            <button class="btn primary" type="button" onclick="location.reload()">Retry</button>
            <a class="btn" href="/login">Open Login</a>
        </div>
    </section>
</main>
</body>
</html>
